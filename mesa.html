<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaquinha de mesa — QR para pedir música e caixinha</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#241a12;
    --papel:#f5efe6;
    --ambar:#b45309;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#121212; color:#f5efe6;
    font-family:"Inter",system-ui,sans-serif;
  }

  /* ---- barra de tela (some na impressão) ---- */
  .barra{
    position:sticky; top:0; z-index:10;
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:16px 22px; background:#18181b; border-bottom:1px solid rgba(245,239,230,.12);
  }
  .barra h1{ font-family:"Bebas Neue",sans-serif; font-size:1.5rem; letter-spacing:.05em; margin:0; font-weight:400; }
  .barra p{ margin:0; font-size:.85rem; color:rgba(245,239,230,.6); flex:1 1 260px; }
  .barra button{
    padding:11px 22px; border-radius:999px; border:0; cursor:pointer; font-weight:700;
    background:linear-gradient(135deg,#f0b429,#d97706); color:#1a1207; font-size:.92rem;
  }
  .barra a{ color:#f0b429; font-size:.85rem; }

  .folha{
    width:210mm; min-height:297mm; margin:26px auto; padding:12mm 10mm;
    background:#fff; display:grid; grid-template-columns:1fr 1fr; gap:8mm;
    align-content:start;
  }

  .placa{
    background:var(--papel); color:var(--tinta);
    border:2px solid var(--tinta); border-radius:6mm;
    padding:8mm 6mm; text-align:center;
    display:flex; flex-direction:column; gap:4mm; align-items:center;
    break-inside:avoid;
  }
  .placa__nome{
    font-family:"Bebas Neue",sans-serif; font-weight:400;
    font-size:26pt; line-height:.95; letter-spacing:.04em; text-transform:uppercase;
  }
  .placa__tag{
    font-size:7.5pt; letter-spacing:.22em; text-transform:uppercase; color:var(--ambar); font-weight:700;
  }
  .placa__linha{ width:70%; height:2px; background:var(--tinta); opacity:.2; }

  .qrs{ display:flex; gap:6mm; justify-content:center; width:100%; }
  .qr{ display:flex; flex-direction:column; align-items:center; gap:2mm; flex:1; }
  .qr svg{ width:100%; max-width:34mm; height:auto; border-radius:2mm; }
  .qr__rot{ font-size:8pt; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .qr__dica{ font-size:6.5pt; line-height:1.3; opacity:.7; max-width:36mm; }

  .placa__rodape{ font-size:7pt; opacity:.65; margin-top:auto; }
  .placa--solo .qr svg{ max-width:46mm; }

  .aviso{
    grid-column:1/-1; padding:10mm; border:2px dashed #b45309; border-radius:4mm;
    color:#7c2d12; background:#fff7ed; font-size:10pt;
  }

  @page{ size:A4; margin:0; }
  @media print{
    body{ background:#fff; }
    .barra{ display:none; }
    .folha{ width:auto; margin:0; padding:10mm; box-shadow:none; }
  }
  @media (max-width:820px){
    .folha{ width:auto; min-height:0; grid-template-columns:1fr; padding:16px; }
  }
</style>
</head>
<body>

<div class="barra">
  <h1>Plaquinha de mesa</h1>
  <p>Quatro plaquinhas por folha A4. Imprima, recorte e deixe nas mesas do bar.</p>
  <button type="button" onclick="window.print()">Imprimir</button>
  <a href="/">← voltar ao site</a>
</div>

<div class="folha" id="folha"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/qr.js"></script>
<script>
(function () {
  "use strict";
  var S = window.SITE, folha = document.getElementById("folha");

  var fone = String(S.contato.whatsapp || "").replace(/\D/g, "");
  var linkPedido = "https://wa.me/" + fone + "?text=" + encodeURIComponent(S.mensagens.pedidoMusica);
  var pix = (S.pix.copiaECola || "").trim();

  function qr(texto) {
    return window.QR.svg(texto, { modulo: 8, margem: 2, claro: "#f5efe6", escuro: "#241a12" });
  }

  if (!fone || /^5599999999999$/.test(fone)) {
    folha.insertAdjacentHTML("beforeend",
      '<div class="aviso"><strong>Antes de imprimir:</strong> troque o número de WhatsApp em ' +
      "<code>assets/js/config.js</code> — o QR abaixo ainda aponta para o número de exemplo.</div>");
  }

  var placa =
    '<div class="placa' + (pix ? "" : " placa--solo") + '">' +
      '<div class="placa__tag">Ao vivo agora</div>' +
      '<div class="placa__nome">' + S.artista.nome + "</div>" +
      '<div class="placa__linha"></div>' +
      '<div class="qrs">' +
        '<div class="qr">' + qr(linkPedido) +
          '<div class="qr__rot">Peça sua música</div>' +
          '<div class="qr__dica">Aponte a câmera e mande o nome da música no WhatsApp</div>' +
        "</div>" +
        (pix
          ? '<div class="qr">' + qr(pix) +
              '<div class="qr__rot">Caixinha</div>' +
              '<div class="qr__dica">Pix pelo QR do seu banco. Valeu demais!</div>' +
            "</div>"
          : "") +
      "</div>" +
      '<div class="placa__rodape">' + (S.site && S.site.url ? S.site.url.replace(/^https?:\/\//, "") : "") + "</div>" +
    "</div>";

  folha.insertAdjacentHTML("beforeend", placa + placa + placa + placa);
})();
</script>
</body>
</html>
